<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Scolaire - Cahier de Texte 1F</title>

  <style>
    :root {
      /* PALETTE SOMBRE SOBRE (Deep Slate / Neutral) */
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-surface: #334155;
      --bg-input: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #475569;
      --primary-hover: #64748b;
      --accent-glow: rgba(100, 116, 139, 0.2);
      
      /* Couleurs Matières Sobres & Désaturées */
      --mat-francais: #e11d48;
      --mat-maths: #2563eb;
      --mat-ens-spc: #0284c7;
      --mat-ens-svt: #059669;
      --mat-hg: #d97706;
      --mat-emc: #b45309;
      --mat-anglais: #db2777;
      --mat-ses: #7c3aed;
      --mat-hggsp: #ea580c;
      --mat-amc: #9333ea;
      --mat-spc: #0369a1;
      --mat-svt: #16a34a;
      --mat-nsi: #4f46e5;
    }

    /* PALETTE CLAIRE SOBRE (Gris Minéral / Contraste Élevé) */
    body.light-mode {
      --bg-main: #e2e8f0;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --bg-input: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #475569;
      --primary: #334155;
      --primary-hover: #1e293b;
      --accent-glow: rgba(51, 65, 85, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    /* --- SIDEBAR DE NAVIGATION --- */
    .sidebar {
      width: 260px;
      background-color: var(--bg-card);
      border-right: 2px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: fixed;
      height: 100vh;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding: 0 8px 4px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-item:hover {
      background: var(--bg-surface);
      border-color: var(--border);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* --- CONTENU PRINCIPAL --- */
    .main-wrapper {
      margin-left: 260px;
      flex: 1;
      padding: 32px 40px;
      max-width: 1400px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .academic-badge {
      background: var(--bg-card);
      border: 2px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* BANNIÈRE URGENCES */
    .urgent-section {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
    }

    .urgent-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
